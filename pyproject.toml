[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almolml"
version = "0.1.0"
description = "Benchmarking pipeline for SCAM classification with classical, deep learning, and active learning variants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pandas",
    "scipy",
    "scikit-learn>=1.3,<1.5",
    "rdkit",
    "skorch==1.4.0",
]

[project.optional-dependencies]
# torch ships as two mutually exclusive builds -- pick one:
#   uv sync --extra cpu   (portable, no GPU driver needed; what CI/Docker use)
#   uv sync --extra gpu   (CUDA build; requires a matching NVIDIA driver)
# See "Environment Notes" in README for how these route to different wheel
# indexes via [tool.uv.sources]/[tool.uv.index] below.
cpu = ["torch==2.14.0"]
gpu = ["torch==2.14.0"]
test = ["pytest"]
graph = [
    "torch-geometric>=2.8.0.post1",
]

[project.scripts]
almolml = "almolml.cli:main"

[tool.setuptools]
packages = ["almolml"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.black]
line-length = 88
include = '\.pyi?$'

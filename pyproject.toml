[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almolml"
version = "0.1.0"
description = "Benchmarking pipeline for SCAM classification with classical, deep learning, and active learning variants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pandas",
    "scipy",
    "scikit-learn>=1.3,<1.5",
    "rdkit",
    "torch==2.14.0",
    "skorch==1.4.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
almolml = "almolml.cli:main"

[tool.setuptools]
packages = ["almolml"]

[tool.black]
line-length = 88
include = '\.pyi?$'

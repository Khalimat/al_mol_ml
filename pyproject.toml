[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jcim-scams-pipeline"
version = "0.1.0"
description = "Benchmarking pipeline for SCAM classification with classical, deep learning, and active learning variants."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
jcim = "jcim.cli:main"

[tool.setuptools]
packages = ["jcim"]

[tool.black]
line-length = 88
include = '\.pyi?$'
